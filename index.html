<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COAST Insurance — Sign In</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/logo/coast-logo.png" alt="Coast Insurance logo" class="login-logo">

      <h1>This site is password protected</h1>
      <p class="login-sub">Enter the access password to continue.</p>

      <form id="loginForm" autocomplete="off">
        <input type="password" id="passwordInput" placeholder="Password" autofocus>
        <button type="submit" class="login-btn">Enter</button>
      </form>

      <p class="login-error" id="loginError" style="display:none;">Incorrect password. Try again.</p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
