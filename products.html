<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COAST Insurance — Products</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <header class="site-header">
    <div class="logo-block">
      <img src="assets/logo/coast-logo.png" alt="Coast Insurance logo" class="logo-img">
    </div>
  </header>

  <main class="products-page">
    <h1>Products</h1>
    <p class="subtitle">Browse and compare all available insurance plans.</p>

    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search insurance plans...">
      </div>
      <button id="searchBtn" class="search-btn">Search</button>
    </div>

    <div class="filter-pills" id="filterPills">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill" data-filter="private-vessels">Private Vessels</button>

    </div>

    <p class="results-count" id="resultsCount">3 plans · Page 1 of 1</p>

  <div class="product-grid" id="productGrid">

    <a href="jet-ski.html" class="card-link">
      <div class="product-card" data-category="private-vessels" data-name="Private Vessels Comprehensive PWC Jet Ski">
        <div class="card-image">
          <img src="assets/images/product-1.jpg" alt="Private Vessels Comprehensive PWC Jet Ski">
        </div>
      </div>
    </a>

    <a href="CPWC.html" class="card-link">
      <div class="product-card" data-category="private-vessels" data-name="Private Vessels Comprehensive Pleasure Craft">
        <div class="card-image">
          <img src="assets/images/product-2.jpg" alt="Private Vessels Comprehensive PWC">
        </div>
      </div>
    </a>

    <div class="product-card" data-category="private-vessels" data-name="Private Vessels Third Party Only Pleasure Craft">
      <div class="card-image">
        <img src="assets/images/product-3.jpg" alt="Private Vessels Third Party Only Pleasure Craft">
      </div>
    </div>

  </div>

    <p class="no-results" id="noResults" style="display:none;">No plans match your search.</p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
